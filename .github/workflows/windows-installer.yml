# Builds the Windows installer (make_windows_installer.py) on a Windows
# machine of GitHub: by hand (Actions -> Windows installer -> Run workflow)
# or for a pushed tag v*.  The installer is the run's artifact
# "SANR-windows-installer"; for a tag it is also attached to a draft release.
name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the tags: the version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Tests (reported, not blocking the build)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install pytest
          python setup.py build_ext --inplace
          python -m pytest tests -q -x -p no:cacheprovider --deselect tests/test_dream_window.py::test_chain_curves_over_the_bands
      - name: Build
        run: python make_windows_installer.py --strict
      - uses: actions/upload-artifact@v4
        with:
          name: SANR-windows-installer
          path: build/windows/installer/*.exe
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: build/windows/installer/*.exe
