# Builds SANR's installers on GitHub's machines, one per platform:
#   Windows x64     SANR-<version>-x64-setup.exe    (make_windows_installer.py)
#   Windows ARM64   SANR-<version>-arm64-setup.exe  (make_windows_installer.py)
#   macOS (Apple)   SANR-<version>-macos-arm64.dmg  (make_mac_installer.py)
# by hand (Actions -> Installers -> Run workflow) or for a pushed tag v*.
# Each is an artifact of the run; for a tag the three are attached to a
# draft release (installer/release-notes.md above the changes since the
# previous tag), published by hand on GitHub.
name: Installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            arch: x64
          - name: windows-arm64
            os: windows-11-arm
            arch: arm64
          - name: macos-arm64
            os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the tags: the version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
          cache: pip
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            Invoke-WebRequest https://jrsoftware.org/download.php/is.exe -OutFile is.exe
            Start-Process .\is.exe -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-'
          }
      - name: Tests (reported, not blocking the build)
        if: matrix.name == 'windows-x64'
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install pytest
          python setup.py build_ext --inplace
          python -m pytest tests -q -p no:cacheprovider --deselect tests/test_dream_window.py::test_chain_curves_over_the_bands
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python make_windows_installer.py --strict
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: python make_mac_installer.py --strict
      # one path, so the artifact holds the installer itself at its top
      # (several paths keep their folders from their common one, build/)
      - uses: actions/upload-artifact@v4
        with:
          name: SANR-${{ matrix.name }}
          path: build/${{ runner.os == 'macOS' && 'macos' || 'windows' }}/installer/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # every installer, wherever it landed; none is an error, not a release
      # without assets
      - name: The installers
        shell: bash
        run: |
          find installers -type f
          n=$(find installers -type f \( -name '*.exe' -o -name '*.dmg' \) | wc -l)
          test "$n" -eq 3 || { echo "expected 3 installers, found $n"; exit 1; }
          mkdir -p assets
          find installers -type f \( -name '*.exe' -o -name '*.dmg' \) -exec mv {} assets/ \;
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: SANR ${{ github.ref_name }}
          body_path: installer/release-notes.md
          generate_release_notes: true
          files: assets/*
          fail_on_unmatched_files: true
